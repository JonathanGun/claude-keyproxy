[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-keyproxy"
dynamic = ["version"]
description = "Use several Claude subscriptions in one Claude Code session."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/JonathanGun/claude-keyproxy"

[project.scripts]
keyproxy = "claude_keyproxy.server:main"
keyproxy-up = "claude_keyproxy.cli:main_up"
claude-keyproxy = "claude_keyproxy.cli:main_claude"
keyproxy-mcp = "claude_keyproxy.mcp:main"

[tool.setuptools.dynamic]
version = { attr = "claude_keyproxy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_keyproxy = ["ui/*"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests import the package after putting src/ on the path

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/claude_keyproxy"]
